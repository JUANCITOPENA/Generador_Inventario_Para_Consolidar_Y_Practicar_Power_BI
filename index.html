<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Inventarios Mensuales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { background:#0f172a; color:#e5e7eb; }
        .card { background:#020617; border:1px solid #1e293b; }
        .form-control { background:#020617; color:#e5e7eb; border:1px solid #334155; }
        .btn-primary { background:linear-gradient(90deg,#0ea5e9,#38bdf8); border:none; }
        table { font-size:0.85rem; }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="fw-bold text-center mb-4">📦 Generador de Inventarios Mensuales</h1>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <label>Total registros</label>
            <input type="number" id="totalRegistros" class="form-control" value="2000">
        </div>
        <div class="col-md-3">
            <label>Fecha inicio</label>
            <input type="date" id="fechaInicio" class="form-control" value="2024-01-01">
        </div>
        <div class="col-md-3">
            <label>Fecha fin</label>
            <input type="date" id="fechaFin" class="form-control" value="2024-12-31">
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-primary w-100" onclick="generarInventario()">Generar</button>
        </div>
    </div>

    <div class="card p-3">
        <div class="d-flex gap-2 mb-3">
            <button class="btn btn-success btn-sm" onclick="exportarCSV()">CSV mensual</button>
            <button class="btn btn-warning btn-sm" onclick="exportarExcel()">Excel mensual</button>
            <button class="btn btn-info btn-sm" onclick="exportarJSON()">JSON mensual</button>
        </div>

        <div class="table-responsive" style="max-height:400px;">
            <table class="table table-dark table-bordered table-sm" id="tabla">
                <thead>
                    <tr>
                        <th>Fecha</th><th>Región</th><th>Categoría</th><th>Producto</th>
                        <th>Compra</th><th>Venta</th><th>Entradas</th><th>Salidas</th>
                        <th>Stock Final</th><th>Rotación</th><th>Vendido</th><th>Valor Stock</th><th>Estatus</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const regiones = ["Distrito Nacional","Santo Domingo Este","Santo Domingo Norte","Santo Domingo Oeste","Santiago","La Vega"];
const productos = [
 {c:"Alimentos",p:"Arroz Premium"},{c:"Alimentos",p:"Aceite Vegetal"},{c:"Alimentos",p:"Leche Entera"},
 {c:"Higiene",p:"Papel Higiénico"},{c:"Higiene",p:"Jabón"},{c:"Bebidas",p:"Refresco Cola"},
 {c:"Bebidas",p:"Agua Mineral"},{c:"Limpieza",p:"Detergente"},{c:"Limpieza",p:"Cloro"},
 {c:"Cuidado Personal",p:"Shampoo"},{c:"Cuidado Personal",p:"Crema Corporal"},
 {c:"Bebidas",p:"Jugo Natural"},{c:"Higiene",p:"Pasta Dental"},{c:"Alimentos",p:"Azúcar"},{c:"Alimentos",p:"Harina"}
];

let data = [];

function generarInventario(){
  data = [];
  document.querySelector('#tabla tbody').innerHTML = '';

  const total = +totalRegistros.value;
  const fi = new Date(fechaInicio.value + 'T00:00:00Z');
  const ff = new Date(fechaFin.value + 'T23:59:59Z');

  // 1) Inicializar el stock base real para cada producto antes de simular el año
  let stockFisico = {};
  productos.forEach(x => {
    stockFisico[x.p] = Math.floor(Math.random() * 300) + 150; // Stock inicial inicializado entre 150 y 450 unidades
  });

  // 2) Generar un esqueleto de transacciones temporal
  let temporalData = [];
  for (let i = 0; i < total; i++) {
    const f = new Date(fi.getTime() + Math.random() * (ff - fi));
    const r = regiones[Math.floor(Math.random() * regiones.length)];
    const pr = productos[Math.floor(Math.random() * productos.length)];

    const pc = +(Math.random() * 300 + 50).toFixed(2);
    const pv = +(pc * (1.15 + Math.random() * 0.3)).toFixed(2);

    temporalData.push({
      fechaObj: f,
      fecha: f.toISOString().split('T')[0],
      region: r,
      categoria: pr.c,
      producto: pr.p,
      precio_compra: pc,
      precio_venta: pv
    });
  }

  // 3) Ordenar el esqueleto cronológicamente de forma estricta por fecha
  temporalData.sort((a, b) => a.fechaObj - b.fechaObj);

  // 4) Calcular el flujo de inventario de forma lineal (paso a paso)
  temporalData.forEach(reg => {
    const stockInicial = stockFisico[reg.producto];

    // Entrada de mercancía aleatoria (reabastecimiento ocasional para mantener stock saludable)
    let entradas = 0;
    if (Math.random() > 0.5) { // 50% de probabilidad de recibir lote de compras
      entradas = Math.floor(Math.random() * 80) + 10;
    }

    const disponible = stockInicial + entradas;

    // Las salidas (ventas) nunca pueden superar el inventario disponible acumulado
    let salidas = 0;
    if (disponible > 0) {
      salidas = Math.floor(Math.random() * Math.min(disponible, 60)); // Límite lógico de salidas por transacción
    }

    const stockFinal = disponible - salidas;
    stockFisico[reg.producto] = stockFinal; // Actualizamos el stock global del producto para la siguiente fecha

    // Métricas financieras basadas en las salidas físicas reales
    const rot = +(salidas / Math.max(stockInicial, 1)).toFixed(2);
    const vv = +(salidas * reg.precio_venta).toFixed(2);
    const vs = +(Math.max(stockFinal, 0) * reg.precio_compra).toFixed(2);

    // Estatus basado en el stock final real de la bodega
    let estatus = 'Excelente';
    if (stockFinal <= 0) estatus = 'Inventario Negativo';
    else if (stockFinal < 50) estatus = 'Alerta: Poco Inventario';
    else if (stockFinal < 150) estatus = 'Óptimo';

    data.push({
      fecha: reg.fecha,
      region: reg.region,
      categoria: reg.categoria,
      producto: reg.producto,
      precio_compra: reg.precio_compra,
      precio_venta: reg.precio_venta,
      entradas: entradas,
      salidas: salidas,
      stock_final: stockFinal,
      rotacion: rot,
      valor_vendido: vv,
      valor_stock: vs,
      estatus: estatus
    });
  });

  // 5) Mostrar en la interfaz visual
  const tbody = document.querySelector('#tabla tbody');
  data.forEach(reg => {
    tbody.insertAdjacentHTML(
      'beforeend',
      `<tr><td>${reg.fecha}</td><td>${reg.region}</td><td>${reg.categoria}</td><td>${reg.producto}</td><td>${reg.precio_compra}</td><td>${reg.precio_venta}</td><td>${reg.entradas}</td><td>${reg.salidas}</td><td>${reg.stock_final}</td><td>${reg.rotacion}</td><td>${reg.valor_vendido}</td><td>${reg.valor_stock}</td><td>${reg.estatus}</td></tr>`
    );
  });
}

function agruparPorMes(){
 const m = {};
 const fi = new Date(fechaInicio.value + 'T00:00:00Z');
 const ff = new Date(fechaFin.value + 'T23:59:59Z');

 const cursor = new Date(Date.UTC(fi.getUTCFullYear(), fi.getUTCMonth(), 1));
 const end = new Date(Date.UTC(ff.getUTCFullYear(), ff.getUTCMonth(), 1));

 while (cursor <= end) {
   const key = `${cursor.getUTCFullYear()}-${String(cursor.getUTCMonth()+1).padStart(2,'0')}`;
   m[key] = [];
   cursor.setUTCMonth(cursor.getUTCMonth() + 1);
 }

 data.forEach(d => {
   const key = d.fecha.slice(0,7);
   if (m[key]) m[key].push(d);
 });

 for (const k in m) {
   if (m[k].length === 0) delete m[k];
 }

 return m;
}

function exportarCSV(){
 const m=agruparPorMes();
 let delay = 0;
 for(const k in m){
  if (m[k].length === 0) continue;
  let csv=Object.keys(m[k][0]).join(',')+'\n';
  m[k].forEach(r=>{ csv+=Object.values(r).join(',')+'\n'; });
  
  setTimeout(() => {
    descargar(csv,`inventario_${k}.csv`,'text/csv');
  }, delay);
  delay += 1200;
 }
}

function exportarJSON(){
 const m=agruparPorMes();
 let delay = 0;
 for(const k in m){
  if (m[k].length === 0) continue;
  
  setTimeout(() => {
    descargar(JSON.stringify(m[k],null,2),`inventario_${k}.json`,'application/json');
  }, delay);
  delay += 1200;
 }
}

function exportarExcel(){
 const m=agruparPorMes();
 let delay = 0;
 for(const k in m){
  if (m[k].length === 0) continue;
  
  setTimeout(() => {
    const ws=XLSX.utils.json_to_sheet(m[k]);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Inventario');
    XLSX.writeFile(wb,`inventario_${k}.xlsx`);
  }, delay);
  delay += 1200;
 }
}

function descargar(contenido,nombre,tipo){
 const blob=new Blob([contenido],{type:tipo});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=nombre;
 a.click();
}
</script>

</body>
</html>
